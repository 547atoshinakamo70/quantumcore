<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuantumCore - Redirecting...</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0b0e16;
      color: #e9edf6;
      font-family: system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    .redirect-message {
      background: #12182b;
      border: 1px solid #1b2340;
      border-radius: 16px;
      padding: 2rem;
      max-width: 500px;
    }
    .brand {
      font-weight: 800;
      font-size: 22px;
      background: linear-gradient(135deg, #2c5cf5 0%, #19a6ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }
    .loading {
      color: #93a3d6;
      margin: 1rem 0;
    }
    a {
      color: #2754ff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    // Redirect to React app after 2 seconds
    setTimeout(() => {
      window.location.href = './web/dist/index.html#/';
    }, 2000);
  </script>
</head>
<body>
  <div class="redirect-message">
    <div class="brand">QuantumCore</div>
    <div class="loading">Redirigiendo a la nueva interfaz React...</div>
    <p>La UI legacy ha sido migrada. Si no eres redirigido automáticamente:</p>
    <p><a href="./web/dist/index.html#/">Ir a la nueva interfaz React</a></p>
    <p><a href="./legacy-ui/index.html">Acceder a la UI legacy</a></p>
  </div>
</body>
</html>
